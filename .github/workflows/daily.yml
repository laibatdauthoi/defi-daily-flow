name: daily-report

on:
  schedule:
    - cron: "0 23 * * *"   # 23:00 UTC = 06:00 Vietnam time next day (GitHub may start it a few min late)
  workflow_dispatch:         # "Run workflow" button for manual runs

permissions:
  contents: write            # needed to save the database to the `data` branch

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The SQLite history lives on a separate `data` branch (one commit, overwritten
      # daily) so the main branch history stays small.
      - name: Restore database
        run: |
          mkdir -p data
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:defi_daily_flow.db > data/defi_daily_flow.db
            echo "restored $(du -h data/defi_daily_flow.db | cut -f1)"
          else
            echo "no data branch yet, starting with an empty database"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send report
        id: run
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py   # on data errors it alerts Telegram itself and exits 1

      - name: Save database
        if: always() && hashFiles('data/defi_daily_flow.db') != ''
        run: |
          blob=$(git hash-object -w data/defi_daily_flow.db)
          tree=$(printf "100644 blob %s\tdefi_daily_flow.db\n" "$blob" | git mktree)
          commit=$(git -c user.name="github-actions[bot]" \
                       -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                       commit-tree "$tree" -m "db $(date -u +%F)")
          git push --force origin "$commit:refs/heads/data"

      # Only for failures before/outside main.py (main.py already alerts on its own errors)
      - name: Alert on workflow failure
        if: failure() && steps.run.outcome != 'failure'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=⚠️ DeFi Daily Flow: GitHub workflow failed before the report could run / Workflow lỗi, chưa chạy được bản tin. ${RUN_URL}"
